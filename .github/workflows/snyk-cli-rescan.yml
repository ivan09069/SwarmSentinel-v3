name: focused Snyk CLI rescan

on:
  push:
    branches:
      - security/snyk-cli-rescan-2026-08-26

permissions:
  contents: read

jobs:
  snyk-cli-rescan:
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: jivantorres9
    steps:
      - name: Install Snyk CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global snyk@latest
          snyk --version
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo '::error::SNYK_TOKEN repository secret is not configured.'
            exit 2
          fi

      - name: Clone remediated repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snyk-rescan"
          cd "$RUNNER_TEMP/snyk-rescan"
          git clone --depth 1 --branch main https://github.com/ivan09069/arb-scanner.git
          git clone --depth 1 --branch main https://github.com/ivan09069/trade-executor-service.git
          git clone --depth 1 --branch main https://github.com/ivan09069/SwarmSentinel-v3.git
          git clone --depth 1 --branch master https://github.com/ivan09069/electrum.git

      - name: Run targeted Snyk Open Source scans
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/snyk-rescan"
          OUT="$RUNNER_TEMP/snyk-results"
          mkdir -p "$OUT"
          : > "$OUT/summary.tsv"
          printf 'project\tvulnerabilities\tcritical\thigh\tmedium\tlow\texit_code\n' >> "$OUT/summary.tsv"

          scan() {
            local name="$1"
            local dir="$2"
            local manifest="$3"
            local json="$OUT/${name}.json"

            echo "=== ${name}: ${manifest} ==="
            cd "$dir"
            set +e
            snyk test \
              --org="$SNYK_ORG" \
              --file="$manifest" \
              --package-manager=pip \
              --severity-threshold=low \
              --json-file-output="$json"
            local rc=$?
            set -e

            if [ -s "$json" ]; then
              jq -r --arg name "$name" --argjson rc "$rc" '
                def objs: if type == "array" then .[] else . end;
                [objs | .vulnerabilities[]?] as $v |
                [
                  $name,
                  ($v | length),
                  ($v | map(select(.severity == "critical")) | length),
                  ($v | map(select(.severity == "high")) | length),
                  ($v | map(select(.severity == "medium")) | length),
                  ($v | map(select(.severity == "low")) | length),
                  $rc
                ] | @tsv
              ' "$json" >> "$OUT/summary.tsv"
            else
              printf '%s\tNA\tNA\tNA\tNA\tNA\t%s\n' "$name" "$rc" >> "$OUT/summary.tsv"
            fi

            if [ "$rc" -ge 2 ]; then
              echo "::error::Snyk scan failed for ${name} with exit code ${rc}"
              return "$rc"
            fi
          }

          failures=0
          scan arb-scanner "$ROOT/arb-scanner" requirements.txt || failures=$((failures+1))
          scan trade-executor-service "$ROOT/trade-executor-service" requirements.txt || failures=$((failures+1))
          scan SwarmSentinel-v3 "$ROOT/SwarmSentinel-v3" requirements.txt || failures=$((failures+1))
          scan electrum-hardware-lock "$ROOT/electrum" contrib/deterministic-build/requirements-hw.txt || failures=$((failures+1))

          echo
          echo '=== SNYK CLI RESCAN SUMMARY ==='
          column -t -s $'\t' "$OUT/summary.tsv" || cat "$OUT/summary.tsv"
          echo
          awk -F '\t' 'NR>1 && $2 ~ /^[0-9]+$/ {v+=$2;c+=$3;h+=$4;m+=$5;l+=$6} END {printf "FOCUSED_TOTAL=%d CRITICAL=%d HIGH=%d MEDIUM=%d LOW=%d\n",v,c,h,m,l}' "$OUT/summary.tsv"

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} Snyk scan(s) failed to execute."
            exit 2
          fi
